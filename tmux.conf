set -g @plugin_path '~/.config/tmux/plugins/'

# macOS clipboard passthrough
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# --- ADD THE TOKYO NIGHT PLUGIN HERE ---
set -g @plugin 'janoamaral/tokyo-night-tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Open new pane splits in the current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Move between panes with Prefix + h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-window-option -g mode-keys vi

# mouse mode on
set-option -g mouse on

# Pass scroll and clicks through to mouse-aware apps (e.g. neovim)
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Copy mode to clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
