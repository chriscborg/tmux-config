set -g @plugin_path '~/.config/tmux/plugins/'

# macOS clipboard passthrough
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# --- ADD THE TOKYO NIGHT PLUGIN HERE ---
set -g @plugin 'janoamaral/tokyo-night-tmux'

# Tokyo Night theme settings
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Open new pane splits in the current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Move between panes with Prefix + h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Resize panes using Prefix + Shift + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-window-option -g mode-keys vi

# mouse mode on
set-option -g mouse on

# Pass scroll and clicks through to mouse-aware apps (e.g. neovim)
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Copy mode to clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Commands
# Create a custom tmux command prompt alias named 'dlogs'
set -s command-alias[100] "dlogs=send-keys 'docker logs -f \$(docker ps -lq)' Enter"
set -s command-alias[101] "run-ios=send-keys 'bundle exec fastlane debug' Enter"
set -s command-alias[102] "run-ios-staging=send-keys 'bundle exec fastlane staging' Enter"
set -s command-alias[103] "run-ios-simulator=send-keys 'bundle exec fastlane simulator' Enter"
set -s command-alias[104] "deploy-ios-=send-keys 'bundle exec fastlane beta' Enter"
